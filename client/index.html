    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      const analyticsEndpoint = "%VITE_ANALYTICS_ENDPOINT%";
      const analyticsWebsiteId = "%VITE_ANALYTICS_WEBSITE_ID%";
      if (analyticsEndpoint && analyticsEndpoint !== "%VITE_ANALYTICS_ENDPOINT%" && analyticsWebsiteId && analyticsWebsiteId !== "%VITE_ANALYTICS_WEBSITE_ID%") {
        const analyticsScript = document.createElement("script");
        analyticsScript.defer = true;
        analyticsScript.src = `${analyticsEndpoint}/umami`;
        analyticsScript.setAttribute("data-website-id", analyticsWebsiteId);
        document.head.appendChild(analyticsScript);
      }
    </script>
